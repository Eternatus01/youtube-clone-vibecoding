worker_processes auto;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # `resolve` re-resolves service names after container recreation (Docker DNS).
    upstream api_upstream {
        zone api_upstream 64k;
        server api:8000 resolve;
    }
    upstream seaweedfs_upstream {
        zone seaweedfs_upstream 64k;
        server seaweedfs:8333 resolve;
    }

    server {
        listen 80;
        server_tokens off;
        client_max_body_size 524288000;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /api/ {
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /docs {
            proxy_pass http://api_upstream/docs;
            proxy_set_header Host $host;
        }
        location /redoc {
            proxy_pass http://api_upstream/redoc;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass http://api_upstream/openapi.json;
            proxy_set_header Host $host;
        }

        # Presigned S3 uploads/downloads only. SeaweedFS still validates the signature.
        location /storage/ {
            limit_except GET HEAD PUT OPTIONS {
                deny all;
            }
            proxy_pass http://seaweedfs_upstream/;
            proxy_set_header Host seaweedfs:8333;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_request_buffering off;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, PUT, HEAD, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Range, Content-Type' always;
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        location / {
            root /srv/frontend;
            try_files $uri $uri/ /index.html;
        }

        location /assets/ {
            root /srv/frontend;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }
    }
}