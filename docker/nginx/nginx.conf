worker_processes auto;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream api_upstream      { server api:8000; }
    upstream seaweedfs_upstream { server seaweedfs:8333; }

    server {
        listen 80;
        client_max_body_size 524288000;

        location /api/ {
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /docs {
            proxy_pass http://api_upstream/docs;
            proxy_set_header Host $host;
        }
        location /redoc {
            proxy_pass http://api_upstream/redoc;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass http://api_upstream/openapi.json;
            proxy_set_header Host $host;
        }

        location /storage/ {
            proxy_pass http://seaweedfs_upstream/;
            proxy_set_header Host seaweedfs:8333;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_request_buffering off;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, PUT, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Range' always;
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        location / {
            root /srv/frontend;
            try_files $uri $uri/ /index.html;
        }

        location /assets/ {
            root /srv/frontend;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}