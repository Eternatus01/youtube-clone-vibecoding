version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-yt}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-yt}']
      interval: 5s
      retries: 5

  s3:
    image: zenko/cloudserver:latest
    environment:
      SCALITY_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      SCALITY_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - s3_data:/data
    ports:
      - '127.0.0.1:8000:8000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:8000/_/healthcheck || exit 1']
      interval: 5s
      retries: 5

  api:
    build:
      context: ./backend
      args:
        MODE: api
    env_file: .env
    environment:
      MODE: api
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://yt:change_me@db:5432/yt}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-s3:8000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-s3:8000}
      MINIO_BUCKET: ${MINIO_BUCKET:-videos}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_SECRET: ${REFRESH_SECRET}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-524288000}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./backend:/app:ro
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      args:
        MODE: worker
    env_file: .env
    environment:
      MODE: worker
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://yt:change_me@db:5432/yt}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-s3:8000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-s3:8000}
      MINIO_BUCKET: ${MINIO_BUCKET:-videos}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_SECRET: ${REFRESH_SECRET}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - '${NGINX_PORT:-80}:80'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - s3

volumes:
  pgdata:
  s3_data:
