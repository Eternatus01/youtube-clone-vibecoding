version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-yt}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-yt}']
      interval: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    entrypoint: ['/bin/sh', '/etc/seaweedfs/entrypoint.sh']
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dev_secret_key}
    volumes:
      - seaweedfs_data:/data
      - ./docker/seaweedfs/entrypoint.sh:/etc/seaweedfs/entrypoint.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 8333 || exit 1']
      interval: 5s
      retries: 10

  api:
    build:
      context: ./backend
      args:
        MODE: api
    env_file: .env
    volumes:
      - ./backend:/app:ro
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      args:
        MODE: worker
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - '${NGINX_PORT:-80}:80'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/srv/frontend:ro
    depends_on:
      - api
      - seaweedfs

volumes:
  pgdata:
  seaweedfs_data: